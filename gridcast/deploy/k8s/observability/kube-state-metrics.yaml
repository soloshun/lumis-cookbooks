# kube-state-metrics: Kubernetes object state as metrics, in particular each container's last
# termination reason (OOMKilled, Error, ...). cAdvisor cannot report OOM kills of containers that
# die faster than its scrape interval; the termination reason survives in the pod status.
# Scope: pods in namespace gridcast only. Scraped by the OTel Collector (prometheus/cadvisor).
apiVersion: v1
kind: ServiceAccount
metadata: { name: kube-state-metrics, namespace: observability }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: gridcast-kube-state-metrics }
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: gridcast-kube-state-metrics }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: gridcast-kube-state-metrics }
subjects:
  - { kind: ServiceAccount, name: kube-state-metrics, namespace: observability }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: observability
  labels: { app.kubernetes.io/name: kube-state-metrics }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: kube-state-metrics } }
  template:
    metadata: { labels: { app.kubernetes.io/name: kube-state-metrics } }
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0
          args:
            - --resources=pods
            - --namespaces=gridcast
            - --metric-allowlist=kube_pod_container_status_last_terminated_reason,kube_pod_container_status_restarts_total,kube_pod_container_resource_limits,kube_pod_container_info
          ports: [{ name: http-metrics, containerPort: 8080 }]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 96Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata: { name: kube-state-metrics, namespace: observability }
spec:
  selector: { app.kubernetes.io/name: kube-state-metrics }
  ports: [{ name: http-metrics, port: 8080, targetPort: http-metrics }]
