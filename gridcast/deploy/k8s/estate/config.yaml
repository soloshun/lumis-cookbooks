apiVersion: v1
kind: ConfigMap
metadata: { name: gridcast-runtime, namespace: gridcast }
data:
  GRIDCAST_ENVIRONMENT: local
  GRIDCAST_LOG_FORMAT: json
  GRIDCAST_LOG_LEVEL: INFO
  GRIDCAST_DB_HOST: postgres.platform.svc.cluster.local
  GRIDCAST_DB_PORT: "5432"
  GRIDCAST_DB_NAME: gridcast
  # Pooled connections are recycled every 2 minutes (credential changes surface within ~2 min).
  GRIDCAST_DB_POOL_RECYCLE_SECONDS: "120"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4317
  OTEL_METRIC_EXPORT_INTERVAL: "15000"
  S3_ENDPOINT_URL: http://s3.platform.svc.cluster.local:8333
  S3_BUCKET: gridcast-models
---
apiVersion: v1
kind: ConfigMap
metadata: { name: ingestion-config, namespace: gridcast }
data:
  # Which weather vendor GridCast buys data from. Fallback: wx-secondary.
  INGEST_WEATHER_PROVIDER: wx-primary
  INGEST_WEATHER_PRIMARY_URL: http://weather-primary.vendors.svc.cluster.local
  INGEST_WEATHER_SECONDARY_URL: http://weather-secondary.vendors.svc.cluster.local
  INGEST_GRID_TELEMETRY_URL: http://grid-telemetry.vendors.svc.cluster.local
  INGEST_OBSERVATIONS_INTERVAL_SECONDS: "60"
  INGEST_FORECASTS_INTERVAL_SECONDS: "900"
  INGEST_DEMAND_INTERVAL_SECONDS: "60"
  # Per-request timeout for vendor APIs.
  INGEST_HTTP_TIMEOUT_SECONDS: "15"
---
apiVersion: v1
kind: ConfigMap
metadata: { name: pipeline-config, namespace: gridcast }
data:
  PIPELINE_FEATURE_SERVICE_URL: http://feature-service.gridcast.svc.cluster.local
  PIPELINE_FORECAST_SERVICE_URL: http://forecast-service.gridcast.svc.cluster.local
  PIPELINE_PLANNING_API_URL: http://planning-api.gridcast.svc.cluster.local
  PIPELINE_INTERVAL_SECONDS: "300"
  PIPELINE_REQUEST_TIMEOUT_SECONDS: "120"
  PREFECT_API_URL: http://prefect.platform.svc.cluster.local:4200/api
  PREFECT_LOGGING_EXTRA_LOGGERS: gridcast
  PREFECT_LOGGING_TO_API_BATCH_INTERVAL: "1"
  PREFECT_LOGGING_TO_API_WHEN_MISSING_FLOW: ignore
---
apiVersion: v1
kind: ConfigMap
metadata: { name: forecast-config, namespace: gridcast }
data:
  FORECAST_MODEL_ALIAS: production
  FORECAST_MODEL_POLL_SECONDS: "30"
---
apiVersion: v1
kind: ConfigMap
metadata: { name: operator-config, namespace: gridcast }
data:
  OPERATOR_PLANNING_API_URL: http://planning-api.gridcast.svc.cluster.local
  OPERATOR_POLL_SECONDS: "60"
