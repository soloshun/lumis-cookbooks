apiVersion: v1
kind: Service
metadata: { name: weather-primary, namespace: vendors }
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: weather-vendor-primary }
  ports: [{ name: http, port: 80, targetPort: http, nodePort: 30084 }]
