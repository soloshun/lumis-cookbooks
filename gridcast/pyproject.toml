[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gridcast"
version = "1.0.0"
description = "GridCast: a reproducible energy-forecasting reference estate for testing operational intelligence (Lumis)."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [{ name = "Solomon Eshun", email = "solomoneshun373@gmail.com" }]
dependencies = [
  "fastapi>=0.120,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.36,<2.1",  # opentelemetry-instrumentation-sqlalchemy supports < 2.1
  "psycopg[binary,pool]>=3.2,<4",
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "numpy>=2.1,<3",
  "pyyaml>=6.0,<7",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.30,<2",
  "opentelemetry-instrumentation-fastapi>=0.51b0",
  "opentelemetry-instrumentation-httpx>=0.51b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.51b0",
  "opentelemetry-instrumentation-logging>=0.51b0",
]

[project.optional-dependencies]
# Model training/serving and artifact storage.
ml = [
  "pandas>=2.2,<4",
  "scikit-learn>=1.6,<2",
  "joblib>=1.4,<2",
  "boto3>=1.35,<2",
]
# Workflow orchestration (the pipeline worker image).
pipeline = [
  "prefect>=3.4,<4",
]
# Operator tooling that runs on the developer machine.
ctl = [
  "typer>=0.15,<1",
  "rich>=13.9",
]

[project.scripts]
gridcast = "gridcast.cli:main"
gridcastctl = "gridcast.ctl.app:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
  "mypy>=1.14",
  "types-pyyaml>=6.0.12",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/gridcast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs the local platform (Postgres from docker compose) running",
  "e2e: needs the full estate (kind cluster + platform) running",
]
addopts = "-m 'not integration and not e2e'"

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["src/gridcast/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
