apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://gridcast-prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      exemplarTraceIdDestinations:
        - { name: trace_id, datasourceUid: tempo }
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://gridcast-loki:3100
    jsonData:
      derivedFields:
        - name: TraceID
          datasourceUid: tempo
          matcherType: label
          matcherRegex: trace_id
          url: "$${__value.raw}"
          urlDisplayLabel: View trace
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://gridcast-tempo:3200
    jsonData:
      serviceMap: { datasourceUid: prometheus }
      nodeGraph: { enabled: true }
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        filterByTraceID: true
        customQuery: true
        query: '{service_name="$${__span.tags["service.name"]}"} | trace_id="$${__trace.traceId}"'
      tracesToMetrics:
        datasourceUid: prometheus
      lokiSearch: { datasourceUid: loki }
  - name: GridCast DB
    uid: gridcast-db
    type: grafana-postgresql-datasource
    access: proxy
    url: gridcast-postgres:5432
    user: gridcast_readonly
    jsonData:
      database: gridcast
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
    secureJsonData:
      password: $GRIDCAST_READONLY_PASSWORD
