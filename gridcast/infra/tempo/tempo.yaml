stream_over_http_enabled: true
server:
  http_listen_port: 3200
  log_level: warn
distributor:
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: 0.0.0.0:4317 }
        http: { endpoint: 0.0.0.0:4318 }
ingester:
  max_block_duration: 5m
compactor:
  compaction: { block_retention: 72h }
storage:
  trace:
    backend: local
    wal: { path: /var/tempo/wal }
    local: { path: /var/tempo/blocks }
# Service graphs and RED span metrics derived from traces: an independent, trace-based view of
# the call topology (which service calls which) that does not rely on any declared config.
metrics_generator:
  registry:
    external_labels: { source: tempo }
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://gridcast-prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage: { path: /var/tempo/generator/traces }
  processor:
    service_graphs:
      dimensions: [k8s.namespace.name]
      enable_client_server_prefix: true
    span_metrics:
      dimensions: [k8s.namespace.name]
overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics, local-blocks]
usage_report: { reporting_enabled: false }
