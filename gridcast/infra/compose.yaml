# GridCast platform services.
#
# These run *outside* the Kubernetes cluster on purpose, standing in for the managed services a
# real estate would rent: a managed PostgreSQL, an observability SaaS (Prometheus / Loki / Tempo /
# Grafana), a hosted orchestrator control plane (Prefect), object storage and an image registry.
# Pods reach them over the shared `kind` Docker network via ExternalName services in the
# `platform` namespace (see deploy/k8s/base/platform).
#
# Start through `make up` (which creates the kind cluster first so the `kind` network exists),
# or directly with `docker compose -f infra/compose.yaml --env-file .env up -d`.

name: gridcast

x-defaults: &defaults
  restart: unless-stopped
  networks: [platform, kind]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  registry:
    <<: *defaults
    image: registry:2
    container_name: gridcast-registry
    ports: ["${REGISTRY_PORT:-5001}:5000"]
    volumes: [registry:/var/lib/registry]
    mem_limit: 512m

  postgres:
    <<: *defaults
    image: postgres:17-alpine
    container_name: gridcast-postgres
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.max=10000
      - -c
      - track_io_timing=on
      - -c
      - track_activity_query_size=4096
      - -c
      - max_connections=120
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_connections=on
      - -c
      - log_line_prefix=%m [%p] user=%u db=%d app=%a client=%h
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GRIDCAST_OWNER_PASSWORD: ${GRIDCAST_OWNER_PASSWORD}
      GRIDCAST_INGEST_PASSWORD: ${GRIDCAST_INGEST_PASSWORD}
      GRIDCAST_APP_PASSWORD: ${GRIDCAST_APP_PASSWORD}
      GRIDCAST_PLANNING_PASSWORD: ${GRIDCAST_PLANNING_PASSWORD}
      GRIDCAST_PIPELINE_PASSWORD: ${GRIDCAST_PIPELINE_PASSWORD}
      GRIDCAST_READONLY_PASSWORD: ${GRIDCAST_READONLY_PASSWORD}
      PREFECT_DB_PASSWORD: ${PREFECT_DB_PASSWORD}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d gridcast"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 768m
    shm_size: 256m

  postgres-exporter:
    <<: *defaults
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    container_name: gridcast-postgres-exporter
    command: ["--collector.stat_statements", "--collector.stat_activity_autovacuum", "--collector.long_running_transactions"]
    environment:
      DATA_SOURCE_URI: gridcast-postgres:5432/gridcast?sslmode=disable
      DATA_SOURCE_USER: gridcast_readonly
      DATA_SOURCE_PASS: ${GRIDCAST_READONLY_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 96m

  pgadmin:
    <<: *defaults
    image: dpage/pgadmin4:9.16
    container_name: gridcast-pgadmin
    entrypoint: ["/bin/sh", "/pgadmin-config/entrypoint.sh"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
      PGADMIN_SERVER_JSON_FILE: /pgadmin-config/servers.json
      PGADMIN_DISABLE_POSTFIX: "true"
      GRIDCAST_OWNER_PASSWORD: ${GRIDCAST_OWNER_PASSWORD}
      GRIDCAST_READONLY_PASSWORD: ${GRIDCAST_READONLY_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["${PGADMIN_PORT:-5050}:80"]
    volumes:
      - pgadmin:/var/lib/pgadmin
      - ./pgadmin:/pgadmin-config:ro
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 512m

  s3:
    <<: *defaults
    image: chrislusf/seaweedfs:4.48
    container_name: gridcast-s3
    entrypoint: ["/bin/sh", "/seaweedfs/entrypoint.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - "${S3_PORT:-8333}:8333"                 # S3 API
      - "${S3_MASTER_UI_PORT:-9333}:9333"       # master UI: cluster topology, volumes
      - "${S3_FILER_UI_PORT:-8888}:8888"        # filer UI: browse buckets/objects
    volumes:
      - s3:/data
      - ./seaweedfs:/seaweedfs:ro
    mem_limit: 384m

  s3-admin:
    <<: *defaults
    image: chrislusf/seaweedfs:4.48
    container_name: gridcast-s3-admin
    # SeaweedFS admin UI (buckets, volumes, maintenance) on http://localhost:23646
    command:
      - admin
      - -port=23646
      - -master=gridcast-s3:9333
      - -dataDir=/data
      - -adminUser=admin
      - -adminPassword=${S3_ADMIN_PASSWORD:-admin}
    ports: ["${S3_ADMIN_UI_PORT:-23646}:23646"]
    volumes: [s3-admin:/data]
    depends_on: [s3]
    mem_limit: 192m

  prometheus:
    <<: *defaults
    image: prom/prometheus:v3.5.0
    container_name: gridcast-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-otlp-receiver
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
      - --enable-feature=exemplar-storage,native-histograms
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - prometheus:/prometheus
      - ./prometheus:/etc/prometheus:ro
    mem_limit: 768m

  loki:
    <<: *defaults
    image: grafana/loki:3.5.3
    container_name: gridcast-loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    ports: ["${LOKI_PORT:-3100}:3100"]
    volumes:
      - loki:/loki
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
    mem_limit: 512m

  tempo:
    <<: *defaults
    image: grafana/tempo:2.8.2
    container_name: gridcast-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports: ["${TEMPO_PORT:-3200}:3200"]
    volumes:
      - tempo:/var/tempo
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    mem_limit: 768m

  grafana:
    <<: *defaults
    image: grafana/grafana:12.1.1
    container_name: gridcast-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor,correlations
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/gridcast-overview.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GRIDCAST_READONLY_PASSWORD: ${GRIDCAST_READONLY_PASSWORD}
    ports: ["${GRAFANA_PORT:-3001}:3000"]
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, loki, tempo]
    mem_limit: 384m

  prefect:
    <<: *defaults
    image: prefecthq/prefect:3-python3.12
    container_name: gridcast-prefect
    command: ["prefect", "server", "start", "--host", "0.0.0.0", "--port", "4200"]
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:${PREFECT_DB_PASSWORD}@gridcast-postgres:5432/prefect
      PREFECT_UI_API_URL: http://localhost:${PREFECT_PORT:-4200}/api
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      PREFECT_SERVER_API_HOST: 0.0.0.0
    ports: ["${PREFECT_PORT:-4200}:4200"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:4200/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 768m

networks:
  platform:
    name: gridcast-platform
  kind:
    name: kind
    external: true

volumes:
  registry:
  postgres:
  pgadmin:
  s3:
  s3-admin:
  prometheus:
  loki:
  tempo:
  grafana:
