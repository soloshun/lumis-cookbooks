# Lumis project for the GridCast estate (schema: lumis.dev/operational-v1alpha1).
#
# What Lumis gets:   read-only Kubernetes discovery of namespace `gridcast`, Prometheus instant
#                    queries, the trace-derived service graph, a declared logical topology, and an
#                    allowlist of GridCast source / GitOps files for the optional agent.
# What it never gets: the chaos ground truth (.gridcast/chaos), vendor admin tokens, Secrets,
#                    write access to anything. The kernel is read-only by construction.
#
# Canonical entity IDs: service:gridcast:<name>  (Kubernetes app label == OTel service.name).
api_version: lumis.dev/operational-v1alpha1
project:
  name: gridcast
  environment: local

sources:
  kubernetes:
    enabled: true
    context: kind-gridcast
    namespace: gridcast
  prometheus:
    enabled: true
    endpoint: http://localhost:9090
    discover_service_graph: true
    service_namespace: gridcast
    service_graph_query: 'sum by (client, server) (rate(traces_service_graph_request_total[5m]))'
  # Native read-only query connectors (lumis-sdk c757a74+). Counts/entries cover the whole
  # incident window; zero matches produce *no* fact (absence is not proof), and results at
  # max_results are marked degraded, so they can support a signature but never falsify one.
  loki:
    enabled: true
    endpoint: http://localhost:3100
    max_results: 100
  tempo:
    enabled: true
    endpoint: http://localhost:3200
    max_results: 20
  prefect:
    enabled: true
    endpoint: http://localhost:4200/api
    flow_names: [forecast-pipeline, train-model]
    max_results: 50

identity:
  aliases:
    # Tempo names the database node after db.name ("gridcast"); give it a clearer identity.
    'service:gridcast:gridcast': 'service:gridcast:postgres'

discovery:
  timeout_seconds: 30

models:
  provider: openrouter
  model: deepseek/deepseek-v4-flash
  api_key_env: OPENROUTER_API_KEY

policies:
  default_action_mode: read_only

# Declared (business/ownership) topology. Discovery adds Kubernetes resources and observed call
# edges; this layer adds what discovery cannot know: external vendors, the database, owners and
# criticality, and dependencies that may carry no traffic at incident time (e.g. a scaled-down
# service). Edges point server -> client ("serves"), the same orientation as the service graph.
graph:
  entities:
    - {id: 'service:gridcast:grid-operator', kind: service, name: grid-operator,
       attributes: {service.namespace: gridcast, role: consumer, criticality: critical, owner: grid-operations}}
    - {id: 'service:gridcast:planning-api', kind: service, name: planning-api,
       attributes: {service.namespace: gridcast, criticality: critical, owner: planning-team}}
    - {id: 'service:gridcast:forecast-pipeline', kind: service, name: forecast-pipeline,
       attributes: {service.namespace: gridcast, criticality: high, owner: forecasting-team}}
    - {id: 'service:gridcast:feature-service', kind: service, name: feature-service,
       attributes: {service.namespace: gridcast, criticality: high, owner: forecasting-team}}
    - {id: 'service:gridcast:forecast-service', kind: service, name: forecast-service,
       attributes: {service.namespace: gridcast, criticality: high, owner: ml-platform}}
    - {id: 'service:gridcast:ingestion', kind: service, name: ingestion,
       attributes: {service.namespace: gridcast, criticality: high, owner: data-platform}}
    - {id: 'service:gridcast:postgres', kind: service, name: postgres,
       attributes: {service.namespace: gridcast, role: database, managed: 'true', criticality: critical}}
    - {id: 'service:gridcast:weather-vendor-wx-primary', kind: service, name: weather-vendor-wx-primary,
       attributes: {service.namespace: gridcast, role: external-vendor, operable: 'false'}}
    - {id: 'service:gridcast:weather-vendor-wx-secondary', kind: service, name: weather-vendor-wx-secondary,
       attributes: {service.namespace: gridcast, role: external-vendor, operable: 'false', fallback_for: weather-vendor-wx-primary}}
    - {id: 'service:gridcast:grid-telemetry', kind: service, name: grid-telemetry,
       attributes: {service.namespace: gridcast, role: external-vendor, operable: 'false'}}
  relationships:
    - {source: 'service:gridcast:planning-api', target: 'service:gridcast:grid-operator', kind: serves, provenance: [declared]}
    - {source: 'service:gridcast:planning-api', target: 'service:gridcast:forecast-pipeline', kind: serves, provenance: [declared]}
    - {source: 'service:gridcast:feature-service', target: 'service:gridcast:forecast-pipeline', kind: serves, provenance: [declared]}
    - {source: 'service:gridcast:forecast-service', target: 'service:gridcast:forecast-pipeline', kind: serves, provenance: [declared]}
    - {source: 'service:gridcast:postgres', target: 'service:gridcast:planning-api', kind: serves, provenance: [declared]}
    - {source: 'service:gridcast:postgres', target: 'service:gridcast:feature-service', kind: serves, provenance: [declared]}
    - {source: 'service:gridcast:postgres', target: 'service:gridcast:forecast-service', kind: serves, provenance: [declared]}
    - {source: 'service:gridcast:postgres', target: 'service:gridcast:ingestion', kind: serves, provenance: [declared]}
    - {source: 'service:gridcast:postgres', target: 'service:gridcast:forecast-pipeline', kind: serves, provenance: [declared]}
    - {source: 'service:gridcast:weather-vendor-wx-primary', target: 'service:gridcast:ingestion', kind: serves, provenance: [declared]}
    - {source: 'service:gridcast:weather-vendor-wx-secondary', target: 'service:gridcast:ingestion', kind: serves, provenance: [declared]}
    - {source: 'service:gridcast:grid-telemetry', target: 'service:gridcast:ingestion', kind: serves, provenance: [declared]}

# Values are rounded (3 decimals; rows/s to integers): the SDK's PII redaction (lumis-sdk c757a74)
# masks long digit runs such as 116245.83746 as phone/card numbers in what the agent sees.
# Operator-registered observations: 16 Prometheus, 5 Loki, 1 Tempo, 2 Prefect, 1 SQL (temporary). Each PromQL returns exactly one sample at the incident end
# time; `or vector(0)` makes "nothing happened" an observation instead of a query error, and
# `(x > -1) or vector(0)` turns an empty-histogram NaN into 0.
queries:
  - id: planning-desired-replicas
    provider: prometheus
    entity_id: 'service:gridcast:planning-api'
    key: desired_replicas
    description: Replicas the planning-api Deployment asks for
    parameters: {promql: 'round(sum(k8s_deployment_desired{k8s_namespace_name="gridcast",k8s_deployment_name="planning-api"}), 0.001)'}
  - id: planning-available-replicas
    provider: prometheus
    entity_id: 'service:gridcast:planning-api'
    key: available_replicas
    description: Replicas of planning-api that are available to serve
    parameters: {promql: 'round(sum(k8s_deployment_available{k8s_namespace_name="gridcast",k8s_deployment_name="planning-api"}), 0.001)'}
  - id: operator-plan-fetch-transport-errors
    provider: prometheus
    entity_id: 'service:gridcast:grid-operator'
    key: plan_fetch_transport_errors_5m
    description: grid-operator plan reads that could not connect in the last 5 minutes
    parameters: {promql: 'round(sum(increase(gridcast_consumer_requests_total{endpoint="/v1/plans/current",outcome="transport_error"}[5m])) or vector(0), 0.001)'}
  - id: pipeline-failed-runs
    provider: prometheus
    entity_id: 'service:gridcast:forecast-pipeline'
    key: failed_runs_15m
    description: Forecast pipeline runs that failed in the last 15 minutes
    parameters: {promql: 'round(sum(increase(gridcast_pipeline_runs_total{status="failed"}[15m])) or vector(0), 0.001)'}
  - id: feature-sql-per-build
    provider: prometheus
    entity_id: 'service:gridcast:feature-service'
    key: sql_statements_per_build
    description: Mean SQL statements issued per feature build over 10 minutes
    parameters: {promql: 'round((sum(increase(gridcast_feature_db_queries_total[10m])) / clamp_min(sum(increase(gridcast_feature_builds_total[10m])), 1)) or vector(0), 0.001)'}
  - id: feature-build-p95
    provider: prometheus
    entity_id: 'service:gridcast:feature-service'
    key: build_p95_seconds
    description: 95th percentile feature build duration over 10 minutes
    parameters: {promql: 'round((histogram_quantile(0.95, sum by (le) (rate(gridcast_feature_build_duration_seconds_bucket[10m]))) > -1) or vector(0), 0.001)'}
  - id: feature-failed-builds
    provider: prometheus
    entity_id: 'service:gridcast:feature-service'
    key: failed_builds_10m
    description: Feature builds that failed in the last 10 minutes
    parameters: {promql: 'round(sum(increase(gridcast_feature_builds_total{status="failed"}[10m])) or vector(0), 0.001)'}
  - id: postgres-rows-scanned
    provider: prometheus
    entity_id: 'service:gridcast:postgres'
    key: rows_scanned_per_s
    description: Rows scanned per second in the gridcast database (5 minute rate)
    parameters: {promql: 'round(sum(rate(pg_stat_database_tup_returned{datname="gridcast"}[5m])))'}
  - id: forecast-oom-kills
    provider: prometheus
    entity_id: 'service:gridcast:forecast-service'
    key: oom_kills_15m
    description: OOM kills of the forecast-service container in the last 15 minutes
    parameters: {promql: 'round(sum(increase(container_oom_events_total{namespace="gridcast",container="forecast-service"}[15m])) or vector(0), 0.001)'}
  - id: forecast-restarts
    provider: prometheus
    entity_id: 'service:gridcast:forecast-service'
    key: restarts_15m
    description: forecast-service container restarts in the last 15 minutes
    parameters: {promql: 'round(sum(delta(k8s_container_restarts{k8s_namespace_name="gridcast",k8s_container_name="forecast-service"}[15m])) or vector(0), 0.001)'}
  - id: forecast-inference-p95
    provider: prometheus
    entity_id: 'service:gridcast:forecast-service'
    key: inference_p95_seconds
    description: 95th percentile model inference time over 10 minutes
    parameters: {promql: 'round((histogram_quantile(0.95, sum by (le) (rate(gridcast_inference_duration_seconds_bucket[10m]))) > -1) or vector(0), 0.001)'}
  - id: forecast-model-reloads
    provider: prometheus
    entity_id: 'service:gridcast:forecast-service'
    key: model_reloads_30m
    description: Times forecast-service swapped its loaded model in the last 30 minutes
    parameters: {promql: 'round(sum(increase(gridcast_model_loads_total[30m])) or vector(0), 0.001)'}
  - id: ingestion-demand-errors
    provider: prometheus
    entity_id: 'service:gridcast:ingestion'
    key: demand_batch_errors_10m
    description: Failed demand ingestion batches in the last 10 minutes
    parameters: {promql: 'round(sum(increase(gridcast_ingest_batches_total{dataset="demand",status="error"}[10m])) or vector(0), 0.001)'}
  - id: ingestion-weather-errors
    provider: prometheus
    entity_id: 'service:gridcast:ingestion'
    key: weather_batch_errors_10m
    description: Failed weather-observation ingestion batches in the last 10 minutes
    parameters: {promql: 'round(sum(increase(gridcast_ingest_batches_total{dataset="weather_observations",status="error"}[10m])) or vector(0), 0.001)'}
  - id: demand-range-failures
    provider: prometheus
    entity_id: 'service:gridcast:forecast-pipeline'
    key: demand_range_failures_15m
    description: Demand range-check failures recorded by the validation gate in 15 minutes
    parameters: {promql: 'round(sum(increase(gridcast_quality_checks_total{check="range.demand",status="fail"}[15m])) or vector(0), 0.001)'}
  - id: weather-variability-warnings
    provider: prometheus
    entity_id: 'service:gridcast:forecast-pipeline'
    key: weather_variability_warnings_30m
    description: Weather-variability warnings (repeating vendor values) in 30 minutes
    parameters: {promql: 'round(sum(increase(gridcast_quality_checks_total{check="variability.weather_observations",status="warn"}[30m])) or vector(0), 0.001)'}
  # ---- Logs, traces and orchestration (native SDK connectors) ---------------------------------
  - id: feature-auth-failures
    provider: loki
    entity_id: 'service:gridcast:feature-service'
    key: db_auth_failure_log_lines
    description: feature-service log lines reporting PostgreSQL password authentication failures in the incident window
    parameters: {logql: '{service_name="feature-service"} |= "password authentication failed"', output: count}
  - id: ingestion-contract-violations
    provider: loki
    entity_id: 'service:gridcast:ingestion'
    key: contract_violation_log_lines
    description: ingestion log lines reporting a vendor payload contract violation in the incident window
    parameters: {logql: '{service_name="ingestion"} |= "ContractViolation"', output: count}
  - id: ingestion-weather-vendor-503
    provider: loki
    entity_id: 'service:gridcast:ingestion'
    key: weather_vendor_503_log_lines
    description: ingestion log lines reporting HTTP 503 from the primary weather vendor in the incident window
    parameters: {logql: '{service_name="ingestion"} |= "HTTP 503 from weather-primary"', output: count}
  - id: feature-service-error-log
    provider: loki
    entity_id: 'service:gridcast:feature-service'
    key: error_log
    description: feature-service error log records (messages) in the incident window
    parameters: {logql: '{service_name="feature-service"} |= "\"level\": \"error\""', output: entries}
  - id: ingestion-error-log
    provider: loki
    entity_id: 'service:gridcast:ingestion'
    key: error_log
    description: ingestion batch failure log records (messages) in the incident window
    parameters: {logql: '{service_name="ingestion"} |= "ingestion batch failed"', output: entries}
  - id: slow-pipeline-traces
    provider: tempo
    entity_id: 'service:gridcast:forecast-pipeline'
    key: slow_trace_duration_ms
    description: Durations of forecast-pipeline traces slower than 3 s in the window (sampled matches, not a percentile)
    parameters: {traceql: '{ resource.service.name = "forecast-pipeline" && resource.service.namespace = "gridcast" && duration > 3s }', output: duration_ms}
  - id: prefect-failed-flow-runs
    provider: prefect
    entity_id: 'service:gridcast:forecast-pipeline'
    key: failed_flow_runs
    description: forecast-pipeline Prefect flow runs started in the incident window that ended FAILED or CRASHED
    parameters: {flow_name: forecast-pipeline, operation: flow_runs, output: failed_count}
  - id: prefect-flow-runs
    provider: prefect
    entity_id: 'service:gridcast:forecast-pipeline'
    key: flow_run
    description: forecast-pipeline Prefect flow runs (state, duration) started in the incident window
    parameters: {flow_name: forecast-pipeline, operation: flow_runs, output: entries}
  # ---- TEMPORARY: SQL evidence until the SDK ships a SQL provider ------------------------------
  # provider `snapshot` + parameters.source=sql: the harness (src/gridcast_lumis/external_evidence.py)
  # runs this read-only query at the incident end and hands Lumis a normalized observation.
  - id: model-production-alias-changes
    provider: snapshot
    entity_id: 'service:gridcast:forecast-service'
    key: production_alias_changes_30m
    description: Model-registry moves of the production alias in the 30 minutes before incident end
    parameters: {source: sql, sql: "SELECT count(*) FROM ml.model_events WHERE event = 'alias_set' AND alias = 'production' AND at > %(ended_at)s - interval '30 minutes' AND at <= %(ended_at)s"}

# Collected for every incident (orchestration context in each report).
initial_query_ids: [prefect-failed-flow-runs]

# Deterministic triage: diagnostic signatures written as falsifiable hypotheses. Log counts only
# ever *support* a signature (Loki returns no fact for zero matches); every signature that uses
# one is also falsifiable by a Prometheus observable, so a healthy estate contradicts it. Only J's
# signature is terminal: it predicts three independent observables and fully explains its
# symptoms. The others are conservative: a match narrows the search, then escalates to the agent
# (if enabled) or a human, because their observables do not establish *why* (e.g. an OOM kill
# does not say whether a limit, a leak or a spike caused it).
checks:
  - id: planning-api-scaled-to-zero
    terminal: true
    explains_entities: ['service:gridcast:planning-api', 'service:gridcast:grid-operator', 'service:gridcast:forecast-pipeline']
    hypothesis:
      id: sig-planning-api-scaled-to-zero
      statement: planning-api is deliberately scaled to zero replicas, so nothing serves plan reads or publication.
      causal_path: ['service:gridcast:planning-api', 'service:gridcast:grid-operator', 'service:gridcast:forecast-pipeline']
      evidence_needed: [planning-desired-replicas, planning-available-replicas, operator-plan-fetch-transport-errors]
      predictions:
        - {entity_id: 'service:gridcast:planning-api', key: desired_replicas, operator: eq, value: 0}
        - {entity_id: 'service:gridcast:planning-api', key: available_replicas, operator: eq, value: 0}
        - {entity_id: 'service:gridcast:grid-operator', key: plan_fetch_transport_errors_5m, operator: gt, value: 0}
      falsifiers:
        - {entity_id: 'service:gridcast:planning-api', key: desired_replicas, operator: gt, value: 0}

  - id: feature-query-amplification
    hypothesis:
      id: sig-feature-query-amplification
      statement: feature-service issues far more SQL per build than normal, slowing builds and loading PostgreSQL.
      causal_path: ['service:gridcast:feature-service', 'service:gridcast:postgres']
      evidence_needed: [feature-sql-per-build, feature-build-p95]
      predictions:
        - {entity_id: 'service:gridcast:feature-service', key: sql_statements_per_build, operator: gt, value: 100}
        - {entity_id: 'service:gridcast:feature-service', key: build_p95_seconds, operator: gt, value: 1}
      falsifiers:
        - {entity_id: 'service:gridcast:feature-service', key: sql_statements_per_build, operator: le, value: 20}

  - id: feature-builds-failing
    hypothesis:
      id: sig-feature-builds-failing
      statement: feature-service builds are failing (cause not established by metrics alone).
      causal_path: ['service:gridcast:feature-service', 'service:gridcast:forecast-pipeline']
      evidence_needed: [feature-failed-builds]
      predictions:
        - {entity_id: 'service:gridcast:feature-service', key: failed_builds_10m, operator: gt, value: 0}
      falsifiers:
        - {entity_id: 'service:gridcast:feature-service', key: failed_builds_10m, operator: eq, value: 0}

  - id: feature-service-db-auth-failing
    hypothesis:
      id: sig-feature-service-db-auth-failing
      statement: feature-service is being refused by PostgreSQL with password authentication failures while its builds fail.
      causal_path: ['service:gridcast:feature-service', 'service:gridcast:postgres']
      evidence_needed: [feature-failed-builds, feature-auth-failures]
      predictions:
        - {entity_id: 'service:gridcast:feature-service', key: failed_builds_10m, operator: gt, value: 0}
        - {entity_id: 'service:gridcast:feature-service', key: db_auth_failure_log_lines, operator: gt, value: 0}
      falsifiers:
        - {entity_id: 'service:gridcast:feature-service', key: failed_builds_10m, operator: eq, value: 0}

  - id: forecast-service-oom-killed
    hypothesis:
      id: sig-forecast-service-oom-killed
      statement: forecast-service is being OOM-killed and restarting (the reason for the memory pressure is not established).
      causal_path: ['service:gridcast:forecast-service', 'service:gridcast:forecast-pipeline']
      evidence_needed: [forecast-oom-kills, forecast-restarts]
      predictions:
        - {entity_id: 'service:gridcast:forecast-service', key: oom_kills_15m, operator: gt, value: 0}
        - {entity_id: 'service:gridcast:forecast-service', key: restarts_15m, operator: gt, value: 0}
      falsifiers:
        - {entity_id: 'service:gridcast:forecast-service', key: oom_kills_15m, operator: eq, value: 0}

  - id: forecast-model-slowdown
    hypothesis:
      id: sig-forecast-model-slowdown
      statement: Inference slowed after the serving model changed without a restart.
      causal_path: ['service:gridcast:forecast-service', 'service:gridcast:forecast-pipeline']
      evidence_needed: [forecast-inference-p95, forecast-model-reloads, forecast-restarts, model-production-alias-changes]
      predictions:
        - {entity_id: 'service:gridcast:forecast-service', key: inference_p95_seconds, operator: gt, value: 2}
        - {entity_id: 'service:gridcast:forecast-service', key: model_reloads_30m, operator: gt, value: 0}
        - {entity_id: 'service:gridcast:forecast-service', key: production_alias_changes_30m, operator: gt, value: 0}
      falsifiers:
        - {entity_id: 'service:gridcast:forecast-service', key: inference_p95_seconds, operator: lt, value: 1}
        - {entity_id: 'service:gridcast:forecast-service', key: restarts_15m, operator: gt, value: 0}

  - id: demand-feed-rejected
    hypothesis:
      id: sig-demand-feed-rejected
      statement: The grid-telemetry feed is being rejected by ingestion while weather ingestion is healthy.
      causal_path: ['service:gridcast:grid-telemetry', 'service:gridcast:ingestion']
      evidence_needed: [ingestion-demand-errors, ingestion-weather-errors, ingestion-contract-violations]
      predictions:
        - {entity_id: 'service:gridcast:ingestion', key: demand_batch_errors_10m, operator: gt, value: 0}
        - {entity_id: 'service:gridcast:ingestion', key: contract_violation_log_lines, operator: gt, value: 0}
        - {entity_id: 'service:gridcast:ingestion', key: weather_batch_errors_10m, operator: eq, value: 0}
      falsifiers:
        - {entity_id: 'service:gridcast:ingestion', key: demand_batch_errors_10m, operator: eq, value: 0}

  - id: demand-values-out-of-range
    hypothesis:
      id: sig-demand-values-out-of-range
      statement: Demand values arriving from grid-telemetry are implausible (e.g. unit change) while ingestion succeeds.
      causal_path: ['service:gridcast:grid-telemetry', 'service:gridcast:ingestion', 'service:gridcast:forecast-pipeline']
      evidence_needed: [demand-range-failures, ingestion-demand-errors]
      predictions:
        - {entity_id: 'service:gridcast:forecast-pipeline', key: demand_range_failures_15m, operator: gt, value: 0}
        - {entity_id: 'service:gridcast:ingestion', key: demand_batch_errors_10m, operator: eq, value: 0}
      falsifiers:
        - {entity_id: 'service:gridcast:forecast-pipeline', key: demand_range_failures_15m, operator: eq, value: 0}

  - id: weather-feed-failing
    hypothesis:
      id: sig-weather-feed-failing
      statement: The primary weather vendor's observation feed is failing.
      causal_path: ['service:gridcast:weather-vendor-wx-primary', 'service:gridcast:ingestion']
      evidence_needed: [ingestion-weather-errors, ingestion-weather-vendor-503]
      predictions:
        - {entity_id: 'service:gridcast:ingestion', key: weather_batch_errors_10m, operator: gt, value: 0}
        - {entity_id: 'service:gridcast:ingestion', key: weather_vendor_503_log_lines, operator: gt, value: 0}
      falsifiers:
        - {entity_id: 'service:gridcast:ingestion', key: weather_batch_errors_10m, operator: eq, value: 0}

  - id: weather-feed-repeating
    hypothesis:
      id: sig-weather-feed-repeating
      statement: The primary weather vendor repeats identical values with fresh timestamps.
      causal_path: ['service:gridcast:weather-vendor-wx-primary', 'service:gridcast:ingestion', 'service:gridcast:forecast-pipeline']
      evidence_needed: [weather-variability-warnings, ingestion-weather-errors]
      predictions:
        - {entity_id: 'service:gridcast:forecast-pipeline', key: weather_variability_warnings_30m, operator: gt, value: 0}
        - {entity_id: 'service:gridcast:ingestion', key: weather_batch_errors_10m, operator: eq, value: 0}
      falsifiers:
        - {entity_id: 'service:gridcast:forecast-pipeline', key: weather_variability_warnings_30m, operator: eq, value: 0}

# Optional tool-using agent (only with --use-agent). It may read exactly these files and run
# read-only git log/diff on these repositories; the chaos package and .env are never listed.
investigator:
  budget:
    request_limit: 20
    tool_calls_limit: 40          # reasoning models batch several inspect calls per turn
    max_probes: 0
    output_tokens_limit: 32000
    max_tool_characters: 8000
    max_total_tool_characters: 96000
  repositories:
    - id: gitops
      root: ../.gridcast/gitops
      entity_ids: ['service:gridcast:planning-api', 'service:gridcast:feature-service', 'service:gridcast:forecast-service']
      files: [kustomization.yaml, estate/planning-api.yaml, estate/feature-service.yaml,
              estate/forecast-service.yaml, estate/ingestion.yaml, estate/config.yaml,
              estate/forecast-pipeline.yaml, estate/grid-operator.yaml]
    - id: gridcast-source
      root: ..
      entity_ids: ['service:gridcast:feature-service', 'service:gridcast:forecast-service', 'service:gridcast:planning-api']
      files: [src/gridcast/features/store.py, src/gridcast/services/feature_service.py,
              src/gridcast/services/forecast_service.py, src/gridcast/services/planning_api.py,
              src/gridcast/services/ingestion.py, src/gridcast/quality/checks.py,
              deploy/releases.yaml]
  sandbox:
    enabled: false

budget:
  graph_hops: 3
  max_entities: 200
  max_queries: 40
  max_hypotheses: 5
  max_model_output_tokens: 3000
  max_context_characters: 60000
  query_timeout_seconds: 10
